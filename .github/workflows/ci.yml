name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux audio/webview dev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            librsvg2-dev libssl-dev libayatana-appindicator3-dev libdbus-1-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tauri exige que existan los sidecars (`externalBin`: yt-dlp y ffmpeg)
      # para compilar, y build.rs solo los descarga en Windows (~100 MB). Las
      # comprobaciones no los ejecutan (las pruebas con red van con #[ignore]),
      # así que bastan archivos vacíos con el nombre del triple de cada equipo.
      - name: Placeholder sidecars (yt-dlp, ffmpeg)
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p src-tauri/binaries
          for b in yt-dlp ffmpeg; do touch "src-tauri/binaries/$b-$triple$ext"; done
          ls -la src-tauri/binaries

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust checks (clippy + tests)
        working-directory: src-tauri
        # sin `|| cargo check`: ese atajo convertía un fallo de clippy en un
        # éxito en cuanto `cargo check` pasaba, así que el gate no valía nada
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: UI syntax check
        run: node --check ui/app.js

      - name: UI lint + CSS build
        run: |
          npm ci
          npm run lint
          npm test
          npm run build:css
