<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enn</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" style="--qw: 330px">
    <main id="library-pane">
      <div id="lib-head">
        <input id="search" type="search" placeholder="Buscar en tu música…" autocomplete="off" spellcheck="false" />
        <button id="btn-folder" class="btn small" title="Añadir carpeta a la biblioteca">📁 Carpeta</button>
        <button id="btn-files" class="btn small" title="Añadir archivos de audio">🎵 Archivos</button>
        <button id="btn-rescan" class="btn small" title="Re-escaneo de las carpetas">↻</button>
        <button id="btn-save-m3u" class="btn small" title="Guardar la cola como .m3u">💾</button>
        <button id="btn-open-m3u" class="btn small" title="Abrir playlist .m3u">📂</button>
      </div>
      <div id="lib-meta" class="pane-meta"></div>
      <ul id="lib-list" class="track-list"></ul>
      <div id="lib-empty" class="list-hint hidden">
        Tu biblioteca está vacía.<br /><br />
        Añade una <b>carpeta</b> con tu música (se escanea con subcarpetas) o archivos sueltos.<br />
        Doble clic en una canción para reproducirla.
      </div>
    </main>

    <aside id="queue-panel">
      <div class="panel-head">
        <span id="queue-title">Siguientes</span>
        <div class="panel-actions">
          <button id="btn-clear" class="icon-btn" title="Vaciar la cola">✕</button>
        </div>
      </div>
      <ul id="queue" class="track-list"></ul>
      <div id="queue-hint" class="list-hint">
        Lo que suene después aparecerá aquí.
      </div>
    </aside>

    <section id="mixer" class="mixer hidden">
      <div class="mix-row">
        <div class="mix-tone">
          <label>Graves <input type="range" id="mix-bass" min="-12" max="12" step="0.5" value="0" /></label>
          <label>Agudos <input type="range" id="mix-treble" min="-12" max="12" step="0.5" value="0" /></label>
          <label>Balance <input type="range" id="mix-balance" min="-100" max="100" step="1" value="0" /></label>
          <label>Fade <input type="range" id="mix-fade" min="0" max="12" step="0.5" value="0" /><span id="mix-fade-val">0 s</span></label>
          <label>Pista <input type="range" id="mix-track" min="-12" max="12" step="1" value="0" disabled /><span id="mix-track-val">0 dB</span></label>
        </div>
        <div class="mix-eq">
          <div class="mix-eq-top">
            <span>Ecualizador</span>
            <select id="eq-preset">
              <option value="">Personalizado</option>
              <option value="flat">Plano</option>
              <option value="rock">Rock</option>
              <option value="pop">Pop</option>
              <option value="clasica">Clásica</option>
              <option value="bajos">Bajos +</option>
              <option value="voz">Voz</option>
              <option value="treble">Agudos +</option>
            </select>
            <button id="btn-eq-reset" class="icon-btn" title="Plano">0</button>
          </div>
          <div id="eq-bands" class="eq-bands"></div>
        </div>
      </div>
    </section>

    <footer id="controls">
      <button id="btn-shuffle" class="ctl mode" title="Aleatorio: off">🔀<i>off</i></button>
      <button id="btn-repeat" class="ctl mode" title="Repetición: off">🔁<i>off</i></button>
      <button id="btn-prev" class="ctl" title="Anterior">⏮</button>
      <button id="btn-play" class="ctl big" title="Reproducir/Pausar (espacio)">▶</button>
      <button id="btn-next" class="ctl" title="Siguiente">⏭</button>
      <div class="ctl-meta" id="ctl-meta"><span id="mini-title">—</span></div>
      <div class="seekwrap">
        <span id="t-cur" class="tm">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
        <span id="t-dur" class="tm">0:00</span>
      </div>
      <button id="btn-mixer" class="ctl small" title="Mezclador (EQ, tono, balance, fade)">🎛️</button>
      <label class="dev" title="Dispositivo de salida">
        <select id="device">
          <option value="">Predeterminado</option>
        </select>
      </label>
      <label class="vol" title="Volumen">
        <input type="range" id="volume" min="0" max="150" value="80" />
        <span id="vol-num">80</span>
      </label>
    </footer>

    <div id="split" title="Arrastra para ajustar el ancho"></div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="app.js" type="module"></script>
</body>
</html>
