[package]
name = "enn"
version = "0.1.0"
description = "Enn - reproductor de musica ligero"
edition = "2021"

[lib]
name = "enn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# El audio en tiempo real necesita optimización incluso en desarrollo.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
symphonia = { version = "=0.5.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mkv", "mp1", "mp2", "mp3", "ogg", "pcm", "vorbis", "wav"] }
cpal = "0.15"
